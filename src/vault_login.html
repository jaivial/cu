<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cu vault</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f8;
    --card: #ffffff;
    --line: #dfe3ea;
    --field: #ffffff;
    --text: #14161a;
    --muted: #5b6472;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --danger: #b42318;
    --ring: rgba(37, 99, 235, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --line: #2a2f3a;
      --field: #0f1115;
      --text: #e6e8ec;
      --muted: #98a1b2;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --danger: #f87171;
      --ring: rgba(59, 130, 246, .45);
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; place-items: center; min-height: 100vh; margin: 0;
    padding: 1.5rem 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem 1.75rem 1.5rem;
    width: min(25rem, 100%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 28px rgba(0, 0, 0, .06);
  }
  h1 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 .3rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.4rem; }

  label { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); margin: 0 0 .35rem; }

  /* 16px exactly: below that, iOS Safari zooms the viewport the moment the
     field takes focus and never zooms back. `max(16px, 1em)` is the rule the
     rest of the project's UI already follows (mini-tui web/src/app.css). */
  input[type="password"] {
    width: 100%;
    min-height: 44px;
    padding: .7rem .8rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--field);
    color: inherit;
    font-size: max(16px, 1em);
    font-family: inherit;
  }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:focus-visible, button:focus-visible, .remember input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    box-shadow: 0 0 0 5px var(--ring);
  }
  .field { margin-bottom: 1rem; }

  .remember {
    display: flex; align-items: center; gap: .6rem;
    min-height: 44px; margin: -.2rem 0 1.1rem;
    color: var(--text); font-size: .92rem; cursor: pointer;
    user-select: none;
  }
  .remember input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: 0 0 auto; }
  .remember .note { color: var(--muted); }

  button {
    width: 100%; min-height: 44px;
    padding: .7rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1rem; font-family: inherit; font-weight: 500;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button[disabled] { opacity: .6; cursor: progress; }

  .error {
    color: var(--danger);
    min-height: 1.25rem;
    margin: 0 0 .5rem;
    font-size: .9rem;
  }
  .error:empty { min-height: 0; margin-bottom: 0; }
  .hint { color: var(--muted); font-size: .85rem; margin: 1.1rem 0 0; }
  .hint:empty { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1 id="title">cu vault</h1>
  <p class="sub" id="sub">Unlock with the vault master password.</p>
  <p class="error" id="error" role="alert" aria-live="polite"></p>
  <form id="form" novalidate>
    <div class="field">
      <label for="password">Master password</label>
      <input type="password" id="password" placeholder="Master password"
             autocomplete="current-password" autofocus required>
    </div>
    <div class="field" id="confirm-field" hidden>
      <label for="confirm">Repeat it</label>
      <input type="password" id="confirm" placeholder="Repeat it" autocomplete="new-password">
    </div>
    <label class="remember" for="remember">
      <input type="checkbox" id="remember">
      <span>Remember this session <span class="note">— 30 days instead of 12 hours</span></span>
    </label>
    <button type="submit" id="submit">Unlock</button>
  </form>
  <p class="hint" id="hint"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const error = $('error');
let firstRun = false;

function fail(text) {
  error.textContent = text;
  $('password').focus();
}

// Already logged in (a reload, a bookmark, a link from a mail client): only
// the server knows, so ask it rather than guessing from a cookie this page
// cannot read.
fetch('/v1/vault/ui/session')
  .then(r => r.json())
  .then(s => { if (s && s.authenticated) location.replace('/vault/app'); })
  .catch(() => {});

fetch('/v1/vault/ui/state').then(r => r.json()).then(s => {
  if (!s.has_password) {
    firstRun = true;
    $('title').textContent = 'cu vault — first run';
    $('sub').textContent = 'No master password yet: the first one you type here becomes it.';
    $('confirm-field').hidden = false;
    $('confirm').required = true;
    $('hint').textContent =
      'It is the only thing standing between this vault and anyone who finds the URL. Keep it long.';
  }
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('password').value;
  const confirm = $('confirm');
  if (firstRun && password !== confirm.value) {
    fail('The two passwords do not match.');
    return;
  }
  if (!password) {
    fail('Enter the master password.');
    return;
  }
  error.textContent = '';
  const button = $('submit');
  button.disabled = true;
  button.textContent = 'Unlocking…';
  try {
    const reply = await fetch('/v1/vault/ui/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      // Server-side only: the cookie is HttpOnly, so this page never reads or
      // stores the session itself.
      body: JSON.stringify({password, remember: $('remember').checked})
    });
    if (reply.ok) { location.href = '/vault/app'; return; }
    if (reply.status === 429) {
      error.textContent = 'Too many attempts — wait five minutes.';
      button.disabled = false;
      button.textContent = 'Unlock';
      return;
    }
    const body = await reply.json().catch(() => ({}));
    fail(body.error || 'Login failed.');
    button.disabled = false;
    button.textContent = 'Unlock';
  } catch (err) {
    fail('Could not reach the vault. Check the connection and try again.');
    button.disabled = false;
    button.textContent = 'Unlock';
  }
});
</script>
</body>
</html>
