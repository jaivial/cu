<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cu vault</title>
<style>
  :root {
    --paper: #f5f6fa; --white: #fff; --ink: #20242f; --muted: #636774;
    --blue: #3649ed; --blue-dark: #293ac8; --lilac: #e2def9; --mint: #deebe4;
    --line: #dfe1e9; --danger: #c0352b;
  }

  /* Bizvaretto is a light identity; people whose system is dark keep a
     tuned dark scheme instead of a blinding page. */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171a23; --white: #20242f; --ink: #e9ebf3; --muted: #9aa1b5;
      --blue: #6a78ff; --blue-dark: #8b96ff; --lilac: #2a2745; --mint: #1f2d27;
      --line: #323748; --danger: #ff8080;
    }
  }
  @font-face {
    font-family: 'Manrope';
    src: url('/vault/manrope.ttf') format('truetype');
    font-weight: 200 800; font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--paper); color: var(--ink);
    display: grid; place-items: center; min-height: 100dvh; margin: 0;
    padding: 1.5rem 1rem;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2.2rem 1.9rem 1.8rem;
    width: min(25rem, 100%);
    box-shadow: 0 1px 2px rgba(32, 36, 47, .04), 0 12px 32px rgba(32, 36, 47, .06);
  }
  .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -.02em; margin: 0 0 1.4rem; }
  .brand span { color: var(--blue); }
  h1 { font-size: 1.4rem; font-weight: 700; line-height: 1.15; margin: 0 0 .35rem; letter-spacing: -.03em; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0 0 1.5rem; }

  label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin: 0 0 .35rem; }

  /* 16px exactly: below that, iOS Safari zooms the viewport the moment the
     field takes focus and never zooms back. */
  input[type="password"] {
    width: 100%;
    min-height: 48px;
    padding: .7rem .9rem;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--white);
    color: inherit;
    font-size: max(16px, 1em);
    font-family: inherit;
  }
  input::placeholder { color: var(--muted); opacity: .7; }
  input:focus-visible, button:focus-visible, .remember input:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }
  .field { margin-bottom: 1rem; }

  .remember {
    display: flex; align-items: flex-start; gap: .6rem;
    min-height: 44px; margin: -.1rem 0 1.2rem;
    color: var(--ink); font-size: .92rem; cursor: pointer;
    user-select: none;
  }
  .remember input { width: 20px; height: 20px; accent-color: var(--blue); margin: .1rem 0 0; flex: 0 0 auto; }
  .remember span { line-height: 1.35; }
  .remember .note { color: var(--muted); }

  button {
    width: 100%; min-height: 48px;
    padding: .7rem 1.2rem;
    border-radius: 100px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: #fff;
    font-size: 1rem; font-family: inherit; font-weight: 700;
    letter-spacing: -.01em;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  button:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
  button[disabled] { opacity: .55; cursor: progress; }

  .error { color: var(--danger); min-height: 1.25rem; margin: 0 0 .5rem; font-size: .9rem; }
  .error:empty { min-height: 0; margin-bottom: 0; }
  .hint { color: var(--muted); font-size: .85rem; margin: 1.2rem 0 0; }
  .hint:empty { display: none; }
</style>
</head>
<body>
<main class="card">
  <p class="brand">cu<span>·</span>vault</p>
  <h1 id="title">Unlock the vault</h1>
  <p class="sub" id="sub">Your master password opens it.</p>
  <p class="error" id="error" role="alert" aria-live="polite"></p>
  <form id="form" novalidate>
    <div class="field">
      <label for="password">Master password</label>
      <input type="password" id="password" placeholder="Master password"
             autocomplete="current-password" autofocus required>
    </div>
    <div class="field" id="confirm-field" hidden>
      <label for="confirm">Repeat it</label>
      <input type="password" id="confirm" placeholder="Repeat it" autocomplete="new-password">
    </div>
    <label class="remember" for="remember">
      <input type="checkbox" id="remember">
      <span>Remember this session <span class="note">— 30 days instead of 12 hours</span></span>
    </label>
    <button type="submit" id="submit">Unlock</button>
  </form>
  <p class="hint" id="hint"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const error = $('error');
let firstRun = false;

// Where to go after unlocking: a hand-off link brought the person here.
// Only same-origin vault paths are honoured, never an off-site URL.
function nextTarget() {
  const next = new URLSearchParams(location.search).get('next') || '';
  return next.startsWith('/vault/') ? next : '/vault/app';
}

function fail(text) {
  error.textContent = text;
  $('password').focus();
}

// Already logged in (a reload, a bookmark, a link from a mail client): only
// the server knows, so ask it rather than guessing from a cookie this page
// cannot read.
fetch('/v1/vault/ui/session')
  .then(r => r.json())
  .then(s => { if (s && s.authenticated) location.replace(nextTarget()); })
  .catch(() => {});

fetch('/v1/vault/ui/state').then(r => r.json()).then(s => {
  if (!s.has_password) {
    firstRun = true;
    $('title').textContent = 'Choose a master password';
    $('sub').textContent = 'No master password yet: the first one you type here becomes it.';
    $('confirm-field').hidden = false;
    $('confirm').required = true;
    $('hint').textContent =
      'It is the only thing standing between this vault and anyone who finds the URL. Keep it long.';
  }
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('password').value;
  const confirm = $('confirm');
  if (firstRun && password !== confirm.value) {
    fail('The two passwords do not match.');
    return;
  }
  if (!password) {
    fail('Enter the master password.');
    return;
  }
  error.textContent = '';
  const button = $('submit');
  button.disabled = true;
  button.textContent = 'Unlocking…';
  try {
    const reply = await fetch('/v1/vault/ui/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      // Server-side only: the cookie is HttpOnly, so this page never reads or
      // stores the session itself.
      body: JSON.stringify({password, remember: $('remember').checked})
    });
    if (reply.ok) { location.href = nextTarget(); return; }
    if (reply.status === 429) {
      error.textContent = 'Too many attempts — wait five minutes.';
      button.disabled = false;
      button.textContent = 'Unlock';
      return;
    }
    const body = await reply.json().catch(() => ({}));
    fail(body.error || 'Login failed.');
    button.disabled = false;
    button.textContent = 'Unlock';
  } catch (err) {
    fail('Could not reach the vault. Check the connection and try again.');
    button.disabled = false;
    button.textContent = 'Unlock';
  }
});
</script>
</body>
</html>
