[package]
name = "cu"
version = "1.4.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10.1"
# The vault store and its at-rest encryption.
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10.3"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
# QR setup capture: decode a QR off the page (rqrr reads a grayscale image;
# image/png decodes the capture), render one back to SVG for the hand-off page.
image = { version = "0.25", default-features = false, features = ["png"] }
rqrr = "0.10"
qrcode = "0.14"
